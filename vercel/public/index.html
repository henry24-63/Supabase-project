<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT Hub Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <script>
        if (prompt("Enter Access Code:") !== "Adnan@24??") {
            document.body.innerHTML = "<h1 class='text-center mt-20 text-3xl font-bold text-red-600'>Access Denied</h1>";
        }
    </script>

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">OTT Hub Dashboard</h1>
        
        <!-- Add Account Form -->
        <div class="bg-white p-6 rounded shadow mb-8">
            <h2 class="text-xl font-semibold mb-4">Add New Supabase Account</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="name" placeholder="Project Name" class="border p-2 rounded">
                <input id="url" placeholder="Project URL" class="border p-2 rounded">
                <input id="key" placeholder="API Key" class="border p-2 rounded">
                <input id="pass" placeholder="DB Password" class="border p-2 rounded">
                <button onclick="addAccount()" class="bg-blue-500 text-white p-2 rounded">Add Account</button>
            </div>
        </div>

        <!-- Accounts List -->
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-semibold mb-4">Connected Accounts</h2>
            <div id="accountsList" class="space-y-4"></div>
        </div>
    </div>

    <script>
        async function fetchAccounts() {
            const res = await fetch('/api/accounts');
            const data = await res.json();
            const list = document.getElementById('accountsList');
            list.innerHTML = data.map(acc => `
                <div class="flex justify-between items-center border-b pb-2">
                    <div>
                        <p class="font-bold">${acc.name}</p>
                        <p class="text-sm text-gray-500">${acc.project_url}</p>
                    </div>
                    <button onclick="deleteAccount('${acc.id}')" class="text-red-500">Delete</button>
                </div>
            `).join('');
        }

        async function addAccount() {
            const body = {
                name: document.getElementById('name').value,
                project_url: document.getElementById('url').value,
                api_key: document.getElementById('key').value,
                db_password: document.getElementById('pass').value
            };
            await fetch('/api/accounts', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            fetchAccounts();
        }

        async function deleteAccount(id) {
            await fetch('/api/accounts?id=' + id, { method: 'DELETE' });
            fetchAccounts();
        }

        fetchAccounts();
    </script>
</body>
</html>
